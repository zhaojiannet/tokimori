name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: swift format lint --strict --recursive TokimoriKit Apps

      - name: Test package
        run: swift test --package-path TokimoriKit

      - name: Build app
        run: xcodebuild -project Tokimori.xcodeproj -scheme Tokimori -configuration Release build
